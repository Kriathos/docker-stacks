global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Agrega aquí los targets que quieras medir, por ejemplo exporters de cada grupo.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas del host Windows: windows_exporter corre fuera de Docker, en el puerto 9182
  - job_name: windows-host
    static_configs:
      - targets: ["host.docker.internal:9182"]

  # Métricas por contenedor
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
