version: "3.9"

networks:
  mynet:
    external: true

services:
  caddy:
    image: caddy:2.8
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./html:/usr/share/caddy/html
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mynet

volumes:
  caddy_data:
  caddy_config: